spring.application.name=appointments
server.port=8081

# Perfil activo por defecto: dev (H2 en memoria).
# Para usar Oracle real: -Dspring-boot.run.profiles=oracle
spring.profiles.active=dev

# --- Kafka (streaming, ver Caso VidaSalud punto 9) ---
# appointments es el productor de "appointments.events" (fuente de verdad de
# eventos de la atencion, la consume report) y de "audit.timeline" (quien/que/
# cuando, la consume audit). Los topicos ya existen en el cluster (creados por
# infra/kafka/compose.yml con sus particiones/replicas/retencion correctas);
# aqui no se declaran NewTopic para no pisar esa configuracion.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

app.kafka.topic.appointments-events=appointments.events
app.kafka.topic.audit-timeline=audit.timeline

# --- RabbitMQ (mensajeria de tareas, ver Caso VidaSalud punto 8) ---
# appointments es el productor de los 3 comandos (email.send, admission.ticket,
# record.gen); ms-vidasalud-notify es el unico consumidor.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:vidasalud}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:vidasalud}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

