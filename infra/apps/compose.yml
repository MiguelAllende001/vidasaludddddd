version: '3.8'

networks:
  vidasalud-net:
    external: true

services:
  bff-svc:
    build:
      context: ../../bff
      dockerfile: Dockerfile
    container_name: vidasalud-bff
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - APPOINTMENTS_URL=http://appointments-svc:8081
      - CATALOG_URL=http://catalog-svc:8082
      - REPORT_URL=http://report-svc:8083
      - AUDIT_URL=http://audit-svc:8084
    networks:
      - vidasalud-net

  appointments-svc:
    build:
      context: ../../appointments
      dockerfile: Dockerfile
    container_name: vidasalud-appointments
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_RABBITMQ_HOST=vidasalud-rabbitmq1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:9092
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@${DB_HOST}:${DB_PORT:-1521}/${DB_NAME:-FREEPDB1}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-vidasalud}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-vidasalud_pass}
    networks:
      - vidasalud-net

  catalog-svc:
    build:
      context: ../../catalog
      dockerfile: Dockerfile
    container_name: vidasalud-catalog
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@${DB_HOST}:${DB_PORT:-1521}/${DB_NAME:-FREEPDB1}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-vidasalud}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-vidasalud_pass}
    networks:
      - vidasalud-net

  notify-svc:
    build:
      context: ../../notify
      dockerfile: Dockerfile
    container_name: vidasalud-notify
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_RABBITMQ_HOST=vidasalud-rabbitmq1
    networks:
      - vidasalud-net

  audit-svc:
    build:
      context: ../../audit
      dockerfile: Dockerfile
    container_name: vidasalud-audit
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:9092
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@${DB_HOST}:${DB_PORT:-1521}/${DB_NAME:-FREEPDB1}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-vidasalud}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-vidasalud_pass}
    networks:
      - vidasalud-net

  report-svc:
    build:
      context: ../../report
      dockerfile: Dockerfile
    container_name: vidasalud-report
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:9092
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@${DB_HOST}:${DB_PORT:-1521}/${DB_NAME:-FREEPDB1}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-vidasalud}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-vidasalud_pass}
    networks:
      - vidasalud-net

  frontend-svc:
    build:
      context: ../../Frontend
      dockerfile: Dockerfile
    container_name: vidasalud-frontend
    ports:
      - "3000:80"
    networks:
      - vidasalud-net
    depends_on:
      - bff-svc