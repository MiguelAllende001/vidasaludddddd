# Cargado por rabbitmq1 (nodo semilla) al arrancar: crea de una vez el
# usuario, los exchanges, colas y bindings del Caso VidaSalud (punto 8).
# rabbitmq2 no necesita este archivo: al unirse al cluster (ver
# cluster-entrypoint.sh) hereda toda esta metadata automaticamente.
management.load_definitions = /etc/rabbitmq/definitions.json

# Por default, RabbitMQ solo deja entrar por localhost al usuario "guest".
# Como aca no usamos "guest" sino un usuario propio ("vidasalud"), esto no
# aplicaria de todas formas, pero lo dejamos explicito para poder entrar a la
# Management UI (puerto 15672) desde fuera del contenedor sin sorpresas.
loopback_users = none
