spring.application.name=notify
server.port=8083

# --- Conexion a RabbitMQ ---
# Los valores por defecto sirven para levantar el broker localmente
# (docker run rabbitmq / infra/mq/compose.yml con puertos publicados en localhost).
# En Docker Compose (infra/apps/compose.yml) se sobreescriben con variables de entorno.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:vidasalud}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:vidasalud}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# --- Reintentos y DLQ (ver Caso VidaSalud, punto 8: "ACK/NACK explicitos... metricas de DLQ") ---
# Si el listener lanza una excepcion, Spring reintenta 3 veces en el propio
# consumidor (con backoff); si sigue fallando, rechaza el mensaje sin
# reencolarlo (default-requeue-rejected=false) y, como las colas q.cmd.* estan
# declaradas con x-dead-letter-exchange=cmd.dead.dlx (ver infra/mq/definitions.json),
# RabbitMQ lo enruta automaticamente a su cola .dlq correspondiente.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=8000
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10

# --- Actuator: solo salud, notify no expone API de dominio (no es publico) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
