# --- Perfil ORACLE: motor real, para pruebas finales / demo / Docker Compose ---
# Los valores por defecto (localhost/XEPDB1/changeme) sirven para correr contra
# el Oracle local del compose; en Docker Compose se sobreescriben con variables
# de entorno (ver infra/apps/compose.yml).

spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
spring.datasource.username=${DB_USER:vidasalud_catalog}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
