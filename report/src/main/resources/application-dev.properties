# --- Perfil DEV: H2 en memoria, para desarrollo rápido sin Oracle ---

spring.datasource.url=jdbc:h2:mem:reportdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola web de H2, util para ver los datos mientras pruebas:
# http://localhost:8085/h2-console  (JDBC URL: jdbc:h2:mem:reportdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
